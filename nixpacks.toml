[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --class=EditionSeeder --force && php artisan db:seed --class=CommonEditionSeeder --force && php artisan db:seed --class=AdminSeeder --force && php artisan db:seed --class=BackfillUserEditionSeeder --force && (php artisan schedule:work > /dev/null 2>&1 &) && cd public && php -d upload_max_filesize=520M -d post_max_size=520M -d memory_limit=256M -d max_execution_time=300 -S 0.0.0.0:80 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
